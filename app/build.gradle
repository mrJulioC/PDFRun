plugins {
    id 'com.android.application'
}

android {
    namespace 'com.solumetals.pdfrun'
    compileSdk 35

    defaultConfig {
        applicationId 'com.solumetals.pdfrun'
        minSdk 23
        targetSdk 35
        versionCode 20001
        versionName '2.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}
