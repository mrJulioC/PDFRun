name: Construir APK PDF Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle assembleDebug --stacktrace
      - name: Nombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PDF-Run-v2.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Run-v2.0.0
          path: PDF-Run-v2.0.0.apk
          if-no-files-found: error
